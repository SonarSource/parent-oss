name: Unified Dogfooding scans

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: sonar-xs
    name: Build and run shadow scans
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.6.1
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          run-shadow-scans: true
          artifactory-reader-role: private-reader
          maven-args: -Dsonar.organization=sonarsource -Dsonar.projectKey=SonarSource_parent-oss
